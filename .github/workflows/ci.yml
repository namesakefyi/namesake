name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - ".changeset/**"
      - ".vscode/**"
      - "CHANGELOG.md"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Wrangler types
        run: pnpm --filter "@namesake/web" exec wrangler types --check

      - name: Sync Astro types
        run: pnpm --filter "@namesake/web" --filter "@namesake/docs" exec astro sync

      - name: Typecheck (Astro)
        run: pnpm --filter "@namesake/web" --filter "@namesake/docs" exec astro check

      - name: Typecheck
        run: pnpm --filter "@namesake/pdf-manager" exec tsc --noEmit

      - name: Biome
        run: pnpm biome ci
