name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - ".changeset/**"
      - ".vscode/**"
      - "CHANGELOG.md"
  push:
    branches: [main]

permissions:
  actions: write # zizmor: ignore[excessive-permissions]
  contents: write # zizmor: ignore[excessive-permissions]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref }}
          persist-credentials: true

      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect Biome/Wrangler updates
        id: detect
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          biome=false
          wrangler=false
          if ! git diff --quiet "origin/$BASE_REF"...HEAD -G'"@biomejs/biome"'; then
            biome=true
          fi
          if ! git diff --quiet "origin/$BASE_REF"...HEAD -G'"wrangler"'; then
            wrangler=true
          fi
          echo "biome=$biome" >> "$GITHUB_OUTPUT"
          echo "wrangler=$wrangler" >> "$GITHUB_OUTPUT"

      - name: Run Biome migrate
        if: steps.detect.outputs.biome == 'true'
        run: pnpm exec biome migrate --write

      - name: Regenerate Wrangler types
        if: steps.detect.outputs.wrangler == 'true'
        run: pnpm --filter "@namesake/web" exec wrangler types

      - name: Sync Astro types
        run: pnpm --filter "@namesake/web" --filter "@namesake/docs" exec astro sync

      - name: Typecheck (Astro)
        run: pnpm --filter "@namesake/web" --filter "@namesake/docs" exec astro check

      - name: Typecheck
        run: pnpm --filter "@namesake/pdf-manager" exec tsc --noEmit

      - name: Biome
        run: pnpm biome ci

      - name: Update Biome schema
        if: >
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.detect.outputs.biome == 'true'
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "chore: run biome migrate"
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
          file_pattern: "biome.jsonc"
          branch: ${{ github.head_ref }}

      - name: Update Wrangler types
        if: >
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.detect.outputs.wrangler == 'true'
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "chore: regenerate wrangler types"
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
          file_pattern: "web/worker-configuration.d.ts"
          branch: ${{ github.head_ref }}
