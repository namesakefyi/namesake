name: Coverage

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - ".changeset/**"
      - ".vscode/**"
      - "docs/**"
      - "pdf-manager/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Test coverage for the branch under review.
  test-coverage-branch:
    name: Test Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.2"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test coverage
        run: pnpm --filter @namesake/web test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-branch
          path: web/coverage
          overwrite: true

  report-coverage:
    needs: [test-coverage-branch]
    name: Report Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download coverage (branch)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-branch
          path: coverage

      - name: Restore coverage (main)
        id: download-main
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/coverage
          key: coverage-main-${{ github.sha }}
          restore-keys: coverage-main-

      - name: Move coverage (main)
        if: steps.download-main.outputs.cache-matched-key != ''
        run: mv web/coverage coverage-main

      - name: Report coverage and comparison
        if: always() && hashFiles('coverage-main/coverage-summary.json') != ''
        uses: davelosert/vitest-coverage-report-action@74c2d9210b4fc44c84d8213f61d7ec99837b7aa0 # v2.13.2
        with:
          vite-config-path: web/vitest.config.ts
          json-summary-compare-path: coverage-main/coverage-summary.json

        # Fallback to report branch coverage without comparison
        # if coverage from main is not available
      - name: Report coverage
        if: always() && hashFiles('coverage-main/coverage-summary.json') == ''
        uses: davelosert/vitest-coverage-report-action@74c2d9210b4fc44c84d8213f61d7ec99837b7aa0 # v2.13.2
        with:
          vite-config-path: web/vitest.config.ts
