name: Playwright
on:
  push:
    branches: [main]
    paths:
      [
        "web/src/**/*.ts",
        "web/src/**/*.spec.ts",
        "web/src/**/*.astro",
        "web/astro.config.ts",
        "web/playwright.config.ts",
        "web/package.json",
        "pnpm-lock.yaml",
      ]
  pull_request:
    branches: [main]
    paths:
      [
        "web/src/**/*.ts",
        "web/src/**/*.spec.ts",
        "web/src/**/*.astro",
        "web/astro.config.ts",
        "web/playwright.config.ts",
        "web/package.json",
        "pnpm-lock.yaml",
      ]

permissions:
  contents: read

jobs:
  test:
    name: End-to-End (${{ matrix.browser }})
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        shell: bash
        working-directory: web
        run: |
          VERSION=$(node -e "console.log(require('@playwright/test/package.json').version)")
          echo "PLAYWRIGHT_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Cache Playwright browser binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}-${{ matrix.browser }}

      - name: Install Playwright browsers and OS dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: web
        run: pnpm exec playwright install-deps ${{ matrix.browser }}

      - name: Run Playwright tests
        working-directory: web
        run: pnpm exec playwright test --reporter=html --project=${{ matrix.browser }}

      - name: Upload Playwright results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: web/playwright-report/
          retention-days: 30
