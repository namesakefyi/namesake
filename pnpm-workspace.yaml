packages:
  - "web"
  - "docs"
  - "pdf-manager"

allowBuilds:
  esbuild: false
  "@parcel/watcher": false
  sharp: true
  simple-git-hooks: true
  workerd: true

minimumReleaseAge: 0

overrides:
  # Starlight's <Steps> garbles its HTML output in builds when it uses a different
  # satteri version than @astrojs/mdx. Remove once their versions match upstream.
  "@astrojs/starlight>satteri": 0.11.6
