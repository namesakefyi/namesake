bio: Casey is a trans organizer who has helped directly assist over 2,500 trans people through the name change process since 2019. They were a founding member of the first trans union in the country (Union for Trans Liberation), and they served as the Union Chapter Chair for 6 years. Casey currently serves on Philadelphia Mayor Cherelle Parker’s LGBTQ+ Commission, where they advocate for trans people at the city level.
