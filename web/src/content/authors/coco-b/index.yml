bio: Coco is a Philly-based artist, cultural worker and resource redistributor. They lead Namesake’s fund development strategy and external affairs. Since 2014, they have helped raise over eight million dollars for movements and institutions across the U.S. and Mexico. In their freetime, they can be found microdosing 90’s / y2k media and caring for their rescue cats, Flores and Friend.
