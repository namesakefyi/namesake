name: Legal Aid Chicago
description: Legal Aid Chicago offers varied and comprehensive free legal support for low-income individuals and families. *Legal Aid Chicago also hosts regular, free face-to-face general legal clinics in Chicago. Legal Aid Chicago only provides aid for individuals who have an annual income at or below 150% of the current poverty line. All services provided to eligible individuals are free. Services available in English and Spanish.
